<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163d39"><meta name="description" content="Offline personal item locator"><link rel="manifest" href="./manifest.webmanifest"><title>FindMyStuff</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:#f5f7f4;color:#183b35}header{background:#163d39;color:white;padding:18px 16px}h1{margin:0;font-size:24px}header small{opacity:.8}main{max-width:760px;margin:auto;padding:16px 16px 90px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:10px;background:white;border-top:1px solid #ddd}nav button{flex:1;max-width:220px}button,input,select,textarea{font:inherit;border:1px solid #c7d6d0;border-radius:11px;padding:11px;background:white;min-width:0}button{cursor:pointer}button.primary{background:#17695d;color:white;border-color:#17695d}button.danger{color:#a22b2b}input,select,textarea{width:100%}textarea{min-height:76px}label{display:block;font-weight:600;margin:12px 0 5px}.panel,article{background:white;border:1px solid #dce6df;border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 1px 6px #15362b0c}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted,small{color:#5c726b}.hidden{display:none}article h3{margin:0 0 6px}article img{width:100%;max-height:180px;object-fit:contain;border-radius:9px}#notice{color:#17695d;font-weight:600}button:focus-visible,input:focus-visible{outline:3px solid #5bb19f}@media(max-width:420px){.grid{grid-template-columns:1fr}}
